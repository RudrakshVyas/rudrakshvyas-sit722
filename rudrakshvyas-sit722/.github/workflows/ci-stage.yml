name: CI + Staging (testing)

on:
  push:
    branches: [ "testing" ]

env:
  IMAGE_TAG: ${{ github.sha }}
  CUSTOMER_PORT: 8001
  ORDER_PORT: 8002
  PRODUCT_PORT: 8003
  FRONTEND_PORT: 80   # change to 3000 if your frontend uses 3000

jobs:
  build_test_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/customer_service:${IMAGE_TAG} backend/customer_service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/customer_service:${IMAGE_TAG}

          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/order_service:${IMAGE_TAG} backend/order_service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/order_service:${IMAGE_TAG}

          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/product_service:${IMAGE_TAG} backend/product_service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product_service:${IMAGE_TAG}

          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${IMAGE_TAG} frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${IMAGE_TAG}

  stage_deploy_accept_destroy:
    needs: build_test_push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (username/password)
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": null,
              "clientSecret": null,
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "username": "${{ secrets.AZURE_USERNAME }}",
              "password": "${{ secrets.AZURE_PASSWORD }}"
            }

      - name: Create ephemeral staging (ACI)
        run: |
          DNS="sit722-${{ github.run_id }}"
          RG="rg-sit722-10-2d"
          LOC="australiaeast"
          REG_SERVER="index.docker.io"
          REG_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          REG_PASS="${{ secrets.DOCKERHUB_TOKEN }}"

          az container create -g "$RG" -n cust-${{ github.run_id }} \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/customer_service:${{ github.sha }} \
            --registry-login-server $REG_SERVER --registry-username $REG_USER --registry-password $REG_PASS \
            --ports ${{ env.CUSTOMER_PORT }} --dns-name-label ${DNS}-cust --location "$LOC"

          az container create -g "$RG" -n order-${{ github.run_id }} \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/order_service:${{ github.sha }} \
            --registry-login-server $REG_SERVER --registry-username $REG_USER --registry-password $REG_PASS \
            --ports ${{ env.ORDER_PORT }} --dns-name-label ${DNS}-order --location "$LOC"

          az container create -g "$RG" -n product-${{ github.run_id }} \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/product_service:${{ github.sha }} \
            --registry-login-server $REG_SERVER --registry-username $REG_USER --registry-password $REG_PASS \
            --ports ${{ env.PRODUCT_PORT }} --dns-name-label ${DNS}-product --location "$LOC"

          az container create -g "$RG" -n fe-${{ github.run_id }} \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }} \
            --registry-login-server $REG_SERVER --registry-username $REG_USER --registry-password $REG_PASS \
            --ports ${{ env.FRONTEND_PORT }} --dns-name-label ${DNS}-fe --location "$LOC"

          az container wait -g "$RG" -n fe-${{ github.run_id }} \
            --custom "instanceView.state=='Running'" --interval 10 --timeout 600

          echo "DNS_FE=${DNS}-fe.${LOC}.azurecontainer.io" >> $GITHUB_ENV

      - name: Acceptance check
        run: |
          curl -I --fail http://$DNS_FE/ || curl -I --fail http://$DNS_FE:${{ env.FRONTEND_PORT }}/

      - name: Destroy staging
        if: always()
        run: |
          RG="rg-sit722-10-2d"
          az container delete -y -g "$RG" -n fe-${{ github.run_id }}
          az container delete -y -g "$RG" -n cust-${{ github.run_id }}
          az container delete -y -g "$RG" -n order-${{ github.run_id }}
          az container delete -y -g "$RG" -n product-${{ github.run_id }}
