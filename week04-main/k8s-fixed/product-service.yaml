apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: sit722
  labels:
    app: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: product-service
    spec:
      restartPolicy: Always
      containers:
        - name: product-service
          image: docker.io/rudrakshvyas/product-microservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          envFrom:
            - configMapRef:
                name: config-map
            - secretRef:
                name: secrets
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: sit722
  labels:
    app: product-service
spec:
  selector:
    app: product-service
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
