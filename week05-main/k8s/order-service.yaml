apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-w05-aks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: ruddy/order-service:latest
        ports:
        - containerPort: 8001
        env:
        - name: DATABASE_URL
          value: postgresql://postgres:postgres@order-db-service-w05-aks:5432/orderdb
        - name: CUSTOMER_SERVICE_URL
          value: http://customer-service:8002
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP
